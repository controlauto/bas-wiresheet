name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cd frontend && npm install && npm run build
      - run: git diff --exit-code custom_components/bas_wiresheet/frontend/bas-wiresheet-panel.js || echo "::warning::Committed panel bundle differs from a fresh build"
      - run: node --test tests/*.test.js
      - run: pip install pytest && pytest -q tests/test_runtime_parity.py
